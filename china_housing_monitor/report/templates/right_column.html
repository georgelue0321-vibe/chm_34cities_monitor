<!-- RIGHT COLUMN: City Dashboard + Diagnostics + Rankings + Charts -->

<!-- Row 2: City Assessment Terminal (8 cols) — PRIMARY card -->
<div class="lg:col-span-8 order-2 card-primary rounded-xl p-5 sm:p-6 flex flex-col justify-between w-full">
    <div>
        <!-- Top Row: City Name + Level + Status -->
        <div class="flex flex-wrap items-center gap-2.5 mb-4">
            <h2 id="cityNameHeader" class="text-white text-lg sm:text-xl font-extrabold tracking-wide"></h2>
            <span id="cityLevelBadge" class="px-2 py-0.5 bg-slate-800 text-slate-300 border border-slate-700 text-[10px] font-medium rounded-md"></span>
            <span id="cityStatusBadge" class="px-2.5 py-1 rounded-md text-[10px] font-bold"></span>
        </div>

        <!-- Second Row: Score Gauge + Parameters -->
        <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 mb-5 items-center">
            <!-- Score Gauge -->
            <div class="col-span-2 sm:col-span-1 relative aspect-square flex items-center justify-center group cursor-pointer max-w-[120px] mx-auto sm:mx-0">
                <div id="cityRadialScoreChart" class="w-full h-full"></div>
                <div class="absolute flex flex-col items-center justify-center pointer-events-none">
                    <span id="cityScoreStr" class="text-white text-xl font-extrabold"></span>
                    <span class="text-slate-500 text-[8px] font-bold uppercase tracking-wider">底部评估</span>
                </div>
                <!-- Tooltip (hover + focus) -->
                <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 px-3 py-2.5 bg-slate-800 border border-slate-600 rounded-xl opacity-0 group-hover:opacity-100 group-focus-within:opacity-100 transition-opacity duration-200 pointer-events-none z-10 whitespace-nowrap shadow-xl">
                    <div id="tooltipScoreText" class="font-semibold text-white text-[11px]"></div>
                    <div class="text-slate-400 text-[10px]">分数越高，越接近底部区间</div>
                    <div class="text-slate-500 text-[9px] mt-0.5">综合考量价格、收储、全国资金三因子</div>
                </div>
            </div>
            
            <!-- Parameters (Cols 2-5) -->
            <div class="col-span-1 relative surface-inset border border-slate-800/60 rounded-lg p-3 flex flex-col items-center justify-center text-center group cursor-pointer min-h-[90px]">
                <span class="text-slate-500 text-[9px] font-semibold uppercase tracking-wider block">观察状态</span>
                <span id="paramStatus" class="text-white text-xs sm:text-sm font-extrabold mt-1.5 block truncate max-w-full"></span>
                <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 px-3 py-2.5 bg-slate-800 border border-slate-600 rounded-xl opacity-0 group-hover:opacity-100 group-focus-within:opacity-100 transition-opacity duration-200 pointer-events-none z-10 whitespace-nowrap shadow-xl">
                    <div id="tooltipStatusText" class="text-slate-200 text-[10px]"></div>
                </div>
            </div>
            
            <div class="col-span-1 relative surface-inset border border-slate-800/60 rounded-lg p-3 flex flex-col items-center justify-center text-center group cursor-pointer min-h-[90px]">
                <span class="text-slate-500 text-[9px] font-semibold uppercase tracking-wider block">风险等级</span>
                <span id="paramRisk" class="text-rose-400 text-xs sm:text-sm font-extrabold mt-1.5 block"></span>
                <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 px-3 py-2.5 bg-slate-800 border border-slate-600 rounded-xl opacity-0 group-hover:opacity-100 group-focus-within:opacity-100 transition-opacity duration-200 pointer-events-none z-10 whitespace-nowrap shadow-xl">
                    <div id="tooltipRiskText" class="text-slate-200 text-[10px]"></div>
                </div>
            </div>

            <div class="col-span-1 relative surface-inset border border-slate-800/60 rounded-lg p-3 flex flex-col items-center justify-center text-center group cursor-pointer min-h-[90px]">
                <span class="text-slate-500 text-[9px] font-semibold uppercase tracking-wider block">信号强度</span>
                <span id="paramStrength" class="text-white text-xs sm:text-sm font-extrabold mt-1.5 block"></span>
                <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 px-3 py-2.5 bg-slate-800 border border-slate-600 rounded-xl opacity-0 group-hover:opacity-100 group-focus-within:opacity-100 transition-opacity duration-200 pointer-events-none z-10 whitespace-nowrap shadow-xl">
                    <div id="tooltipStrengthText" class="text-slate-200 text-[10px]"></div>
                </div>
            </div>

            <div class="col-span-2 sm:col-span-1 relative surface-inset border border-slate-800/60 rounded-lg p-3 flex flex-col items-center justify-center text-center group cursor-pointer min-h-[90px]">
                <span class="text-slate-500 text-[9px] font-semibold uppercase tracking-wider block">数据可信度</span>
                <span id="paramCredibility" class="text-slate-200 text-[10px] sm:text-[11px] font-semibold mt-1.5 block leading-normal"></span>
                <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 px-3 py-2.5 bg-slate-800 border border-slate-600 rounded-xl opacity-0 group-hover:opacity-100 group-focus-within:opacity-100 transition-opacity duration-200 pointer-events-none z-10 whitespace-nowrap shadow-xl">
                    <div id="tooltipCredibilityText" class="text-slate-200 text-[10px]"></div>
                </div>
            </div>
        </div>

        <!-- Third Row: Scoring Factors (compact, merged) -->
        <div class="surface-inset border border-slate-800/60 rounded-lg px-4 py-2.5 mb-3">
            <div class="space-y-2" id="factorsBreakdownContainer"></div>
        </div>

        <!-- Fourth Row: Broker Consensus -->
        <div class="surface-inset border border-slate-800/60 rounded-lg p-4 mb-3">
            <p class="text-slate-400 text-[9px] font-semibold uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
                <i class="fas fa-brain text-indigo-400"></i>
                本城投研共识结论
            </p>
            <p id="cityConsensusStr" class="text-slate-300 text-[11px] leading-relaxed"></p>
        </div>

        <!-- Drivers -->
        <div class="surface-inset border border-slate-800/60 rounded-lg p-4 text-xs space-y-2">
            <div class="flex items-center gap-2">
                <span class="text-emerald-400 font-semibold flex items-center gap-1.5 w-12 flex-shrink-0">
                    <i class="fas fa-arrow-trend-up"></i> 拉动
                </span>
                <span id="paramPositiveDrivers" class="text-slate-300 font-medium"></span>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-rose-400 font-semibold flex items-center gap-1.5 w-12 flex-shrink-0">
                    <i class="fas fa-arrow-trend-down"></i> 拖累
                </span>
                <span id="paramNegativeDrivers" class="text-slate-300 font-medium"></span>
            </div>
            <div id="capReasonContainer" class="hidden flex items-center gap-2">
                <span class="text-amber-400 font-semibold flex items-center gap-1.5 w-12 flex-shrink-0">
                    <i class="fas fa-exclamation-circle"></i> 封顶
                </span>
                <span id="paramCapReason" class="text-amber-300 font-medium"></span>
            </div>
        </div>
    </div>

    <!-- Disclaimer (always visible, compact) -->
    <div class="border-t border-slate-800/60 pt-2.5 mt-3">
        <div class="flex items-center gap-2 text-[10px]">
            <span class="text-amber-400 font-semibold flex items-center gap-1.5 flex-shrink-0">
                <i class="fas fa-exclamation-circle text-amber-500"></i>
                BSS_LOW_DATA_V1 运行中
            </span>
            <span class="text-slate-500">—</span>
            <span class="text-slate-500 text-[9px]">缺高频验证数据，仅价格+收储+资金三因子，建议交叉验证</span>
        </div>
    </div>
</div>

<!-- Row 2: Signal Diagnosis (4 cols) -->
<div class="lg:col-span-4 order-2 bg-slate-900 border border-slate-800/60 rounded-xl p-5 flex flex-col justify-between w-full">
    <div>
        <h3 class="text-slate-200 text-xs font-bold uppercase tracking-wider flex items-center gap-2 mb-4">
            <i class="fas fa-diagnoses text-indigo-400"></i>
            底部信号诊断与验证意见

        <div class="surface-inset border border-slate-800/60 rounded-lg p-3 mb-3 flex justify-between items-center text-xs">

        </div>

        <div class="space-y-2.5">
            <div class="surface-inset border border-slate-800/60 rounded-lg p-3">
                <span class="text-emerald-400 text-[9px] font-bold uppercase tracking-wider flex items-center gap-1.5 mb-2">
                    <i class="fas fa-check-circle text-emerald-500"></i> 积极支撑项
                </span>
                <div id="interpPositives" class="space-y-1.5 text-[11px] text-slate-300 leading-relaxed"></div>
            </div>
            
            <div class="surface-inset border border-slate-800/60 rounded-lg p-3">
                <span class="text-rose-400 text-[9px] font-bold uppercase tracking-wider flex items-center gap-1.5 mb-2">

                </span>
                <div id="interpNextSteps" class="space-y-1.5 text-[11px] text-slate-300 leading-relaxed"></div>
            </div>
        </div>
    </div>

    <div class="mt-4 border-t border-slate-800/60 pt-3 text-[10px] text-slate-500 leading-relaxed">
        建议从本地住建局网签量、贝壳去化周期等方面做进一步佐证。
    </div>
</div>
