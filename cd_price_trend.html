function getFrameData(fi) {
  const items = CITIES_RAW.map((c, i) => ({
    name: c.name,
    value: +(ALL_INDEX[i][fi] - 100).toFixed(2),
    idx: ALL_INDEX[i][fi],
  }));
  items.sort((a, b) => a.value - b.value);
  return items;
}

function render(fi) {
  const data = getFrameData(fi);
  const names = data.map(d => d.name);
  const values = data.map(d => d.value);
  const maxVal = Math.max(...values.map(Math.abs));

  chart.setOption({
    grid: { left: 68, right: 70, top: 10, bottom: 30 },
    xAxis: {
      type: 'value',
      min: -26,
      max: 0,
      axisLabel: { color: '#666', fontSize: 11, formatter: v => v + '%' },
      splitLine: { lineStyle: { color: '#1a1d27' } },
      axisLine: { show: false },
    },
    yAxis: {
      type: 'category',
      data: names,
      inverse: false,
      axisLabel: { color: '#aaa', fontSize: 12, width: 56, overflow: 'truncate' },
      axisLine: { show: false },
      axisTick: { show: false },
    },
    series: [{
      type: 'bar',
      data: values.map(v => ({
        value: v,
        itemStyle: {
          color: v < -20 ? '#ef4444' : v < -15 ? '#f97316' : v < -12 ? '#f59e0b' : '#22c55e',
          borderRadius: [0, 4, 4, 0],
        },
      })),
      barWidth: 16,
      label: {
        show: true,
        position: 'left',
        formatter: p => {
          const d = data[p.dataIndex];
          return d.name + '  ' + (d.value > 0 ? '+' : '') + d.value + '%';
        },
        color: '#ccc',
        fontSize: 12,
      },
      animationDuration: 200,
      animationEasing: 'cubicOut',
    }],
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'shadow' },
      backgroundColor: '#1a1d27',
      borderColor: '#3a3d47',
      textStyle: { color: '#ccc', fontSize: 12 },
      formatter: p => {
        const d = data[p[0].dataIndex];
        return `<b>${d.name}</b><br>累计涨跌: <b style="color:${d.value < 0 ? '#ef4444' : '#22c55e'}">${d.value}%</b><br>当前指数: ${d.idx}`;
      },
    },
    animation: true,
  }, true);

  const m = MONTHS[fi];
  document.getElementById('monthDisp').textContent = m;
}

function step() {
  render(frame);
  frame++;
  if (frame >= MONTHS.length) {
    clearInterval(timer);
    timer = null;
    document.getElementById('btnPlay').textContent = '▶ 播放';
    return;
  }
}

function togglePlay() {
  if (timer) {
    clearInterval(timer);
    timer = null;
    document.getElementById('btnPlay').textContent = '▶ 播放';
  } else {
    if (frame >= MONTHS.length) frame = 0;
    timer = setInterval(step, speed);
    document.getElementById('btnPlay').textContent = '⏸ 暂停';
  }
}

function resetAnim() {
  if (timer) { clearInterval(timer); timer = null; }
  frame = 0;
  render(0);
  document.getElementById('btnPlay').textContent = '▶ 播放';
}

function setSpeed(s) {
  speed = s;
  document.getElementById('speedLabel').textContent = '速度: ' + s + 'ms/帧';
  if (timer) {
    clearInterval(timer);
    timer = setInterval(step, speed);
  }
}

render(0);
window.addEventListener('resize', () => chart.resize());
